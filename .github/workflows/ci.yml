# GitHub Actions — validates Python tooling used by perf / static-analysis snapshots.
name: CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev
      - "feature/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile metrics scripts
        run: |
          python -m py_compile scripts/whitebox_metrics.py
          python -m py_compile scripts/platform_dependency_metrics.py

      - name: Install package + analysis tools
        run: |
          python -m pip install -U pip
          python -m pip install ".[dev]"

      - name: Platform dependency metrics (bundle, deps, imports, cycles, build time)
        run: python scripts/platform_dependency_metrics.py --root .

      - name: Run whitebox metrics (no benchmark fixture)
        run: python scripts/whitebox_metrics.py --root .
