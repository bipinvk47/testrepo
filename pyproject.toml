[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complexity-sample"
version = "0.1.0"
description = "Multilingual complexity samples plus a Python performance-risk lab for static benchmarks (loops, SQLite N+1, allocations, threads, hotspots)."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.28.0",
  "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.0.0",
  "deptry>=0.14.0",
  "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.deptry]
optional_dependencies_dev_groups = ["dev"]
